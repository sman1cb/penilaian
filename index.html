<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Penilaian CBT</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --success: #059669;
      --success-soft: #ecfdf5;
      --success-border: #a7f3d0;
      --warning: #d97706;
      --warning-soft: #fffbeb;
      --warning-border: #fde68a;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --text-sec: #475569;
      --muted: #64748b;
      --border: #e2e8f0;
      --app-bg: #0f172a;
      --app-card: #1e293b;
      --app-maroon: #7a121d;
      --app-crimson: #e11d48;
      --app-gold: #facc15;
      --q-size: 16px;
      --opt-size: 15px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { touch-action: manipulation; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 88px;
    }
    body.modal-open { overflow: hidden; }
    body.kb-open { padding-bottom: 55vh; }
    #submitModal.kb-modal { align-items: flex-start; padding-top: 24px; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 30;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(30, 58, 138, 0.16);
    }
    .hdr-inner {
      max-width: 780px; margin: 0 auto;
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .hdr-title-wrap { min-width: 0; flex: 1; }
    .hdr-sub { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; opacity: 0.85; font-weight: 600; }
    header h1 {
      margin: 0; font-size: 16px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hdr-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .btn-hdr {
      background: rgba(255,255,255,0.16); color: #fff;
      border: 1px solid rgba(255,255,255,0.28);
      padding: 7px 11px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-hdr:active { background: rgba(255,255,255,0.28); }
    .progress-track { width: 100%; height: 4px; background: rgba(255,255,255,0.2); }
    .progress-fill { height: 100%; width: 0%; background: #34d399; transition: width 0.25s ease; }

    /* Container & Card */
    .container { max-width: 780px; margin: 16px auto; padding: 0 14px; }
    .card {
      background: var(--card); border-radius: 16px; padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.04);
      margin-bottom: 14px;
    }
    .card-top-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .badge-num {
      background: var(--primary-soft); color: var(--primary);
      border: 1px solid var(--primary-border);
      font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px;
    }
    .badge-type {
      font-size: 11px; font-weight: 600; color: var(--muted);
      background: #f8fafc; border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 999px;
    }
    .sec-banner {
      background: #f8fafc; border-left: 3px solid var(--primary);
      padding: 8px 12px; border-radius: 0 8px 8px 0;
      font-size: 13px; font-weight: 600; color: var(--text-sec);
      margin-bottom: 14px;
    }
    .q-title { font-size: var(--q-size); font-weight: 600; color: var(--text); margin: 0 0 12px; word-wrap: break-word; }
    .q-desc { font-size: 13.5px; color: var(--text-sec); margin: -4px 0 14px; word-wrap: break-word; }
    .q-img {
      max-width: 100%; height: auto; border-radius: 12px;
      margin: 10px 0 16px; border: 1px solid var(--border); display: block;
    }
    .req { color: var(--danger); margin-left: 3px; }

    /* Opsi Pilihan Ganda & Checkbox */
    .opt-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 13px 15px; border: 1.5px solid var(--border); border-radius: 12px;
      margin-bottom: 10px; cursor: pointer; background: #fff;
    }
    .opt-item.selected {
      border-color: var(--primary); background: var(--primary-soft);
    }
    .opt-marker {
      width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px;
      background: #f1f5f9; color: var(--text-sec);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; margin-top: 1px;
    }
    .opt-item.selected .opt-marker { background: var(--primary); color: #fff; }
    .opt-text { font-size: var(--opt-size); flex: 1; padding-top: 2px; word-wrap: break-word; }

    /* Input Teks */
    input[type="text"], textarea {
      width: 100%; padding: 13px 14px; border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 15px; font-family: inherit; background: #fff; color: var(--text);
    }
    input[type="text"]:focus, textarea:focus {
      outline: none; border-color: var(--primary);
    }

    /* Hint & Validation Banner */
    .grid-hint {
      font-size: 13px; color: var(--text-sec); background: #f8fafc;
      border: 1px solid var(--border); padding: 9px 12px; border-radius: 10px;
      margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .grid-hint.warn {
      background: var(--warning-soft); border-color: var(--warning-border); color: #92400e;
    }
    .grid-hint.ok {
      background: var(--success-soft); border-color: var(--success-border); color: #065f46;
    }

    /* Kisi Pilihan Ganda & Petak Centang */
    .grid-card {
      border: 1.5px solid var(--border); border-radius: 12px;
      padding: 14px; margin-bottom: 12px; background: #fff;
    }
    .grid-card.answered { border-color: var(--success-border); background: #fcfffe; }
    .grid-card.conflict { border-color: var(--warning); background: var(--warning-soft); }
    .grid-row-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .grid-row-num {
      min-width: 24px; height: 24px; border-radius: 6px;
      background: #e2e8f0; color: var(--text-sec);
      font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; margin-top: 2px;
    }
    .grid-card.answered .grid-row-num { background: var(--success); color: #fff; }
    .grid-card.conflict .grid-row-num { background: var(--warning); color: #fff; }
    .grid-row-label { font-size: var(--opt-size); font-weight: 600; color: var(--text); flex: 1; word-wrap: break-word; }

    .inline-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .inline-pill {
      flex: 1; min-width: 90px; text-align: center;
      padding: 10px 12px; border-radius: 10px;
      border: 1.5px solid var(--border); background: #f8fafc;
      font-size: 14px; font-weight: 600; color: var(--text-sec); cursor: pointer;
    }
    .inline-pill.selected {
      background: var(--primary); border-color: var(--primary); color: #fff;
    }
    .inline-pill.locked {
      opacity: 0.45; border-style: dashed;
    }

    /* Tombol Picker (untuk Menjodohkan & Pengganti Dropdown Native) */
    .match-trigger {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1.5px dashed #94a3b8; background: #f8fafc;
      color: var(--muted); font-size: 14.5px; font-weight: 500;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      cursor: pointer; text-align: left;
    }
    .match-trigger.select-style {
      border-style: solid; border-color: var(--border); background: #fff;
    }
    .match-trigger.filled {
      border-style: solid; border-color: var(--success);
      background: var(--success-soft); color: #065f46; font-weight: 600;
    }
    .grid-card.conflict .match-trigger.filled {
      border-color: var(--warning); background: #fff; color: #92400e;
    }
    .match-trigger-badge {
      font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
      background: rgba(255,255,255,0.85); color: var(--primary); flex-shrink: 0;
    }
    .match-trigger.filled .match-trigger-badge { color: var(--success); }

    /* Petak Kotak Centang */
    .cb-grid-opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .cb-pill {
      padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 14px; background: #f8fafc; color: var(--text); cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; user-select: none;
    }
    .cb-pill .cb-tick { display: none; font-weight: 800; }
    .cb-pill.selected {
      border-color: var(--primary); background: var(--primary-soft);
      color: var(--primary-dark); font-weight: 600;
    }
    .cb-pill.selected .cb-tick { display: inline; }
    .cb-pill.locked { opacity: 0.45; border-style: dashed; }

    /* Footer Solid */
    .footer-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: #ffffff;
      border-top: 1px solid var(--border);
      box-shadow: 0 -2px 8px rgba(15, 23, 42, 0.05);
      padding: 10px 14px;
    }
    .footer-inner {
      max-width: 780px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .btn {
      border: none; border-radius: 10px; padding: 11px 16px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-warning { background: var(--warning-soft); color: #b45309; border: 1.5px solid var(--warning-border); }
    .btn-warning.active { background: var(--warning); border-color: var(--warning); color: #fff; }
    .btn-outline { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Modal & Bottom Sheet */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.62); z-index: 50;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-bg.open { display: flex; }
    .modal-bg.sheet-mode { align-items: flex-end; padding: 0; }
    .modal-box {
      background: #fff; border-radius: 18px; width: 100%; max-width: 460px;
      max-height: 85vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.18);
    }
    .sheet-mode .modal-box {
      max-width: 780px; border-radius: 20px 20px 0 0;
      max-height: 82vh; padding: 18px 18px 24px;
    }
    .sheet-handle { width: 40px; height: 4px; background: #cbd5e1; border-radius: 99px; margin: 0 auto 14px; }
    .sheet-context {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font-size: 14px; font-weight: 600; margin-bottom: 14px;
    }
    .sheet-opt {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px;
      margin-bottom: 8px; cursor: pointer; background: #fff;
    }
    .sheet-opt.selected { border-color: var(--success); background: var(--success-soft); }
    .sheet-opt.locked { opacity: 0.55; background: #f8fafc; border-style: dashed; }
    .sheet-opt-key {
      width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
      background: #f1f5f9; color: var(--text-sec); font-weight: 700; font-size: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .sheet-opt.selected .sheet-opt-key { background: var(--success); color: #fff; }
    .sheet-opt-body { flex: 1; font-size: 14.5px; }
    .used-tag {
      display: inline-block; font-size: 11px; color: var(--muted);
      background: #f1f5f9; padding: 2px 7px; border-radius: 5px; margin-top: 3px;
    }
    .used-tag.strict {
      background: #ffe4e6; color: #be123c; font-weight: 600;
    }

    /* Notifikasi Kustom Tema Aplikasi */
    #notifModal { z-index: 70; background: rgba(15, 23, 42, 0.74); }
    .notif-box {
      background: var(--app-card);
      color: #f8fafc;
      border-radius: 16px;
      width: 100%; max-width: 340px;
      padding: 22px 20px 18px;
      border: 1.5px solid var(--app-crimson);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .notif-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(225, 29, 72, 0.16);
      border: 1px solid rgba(225, 29, 72, 0.45);
      color: var(--app-gold);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
    }
    .notif-msg {
      font-size: 15px; font-weight: 600; line-height: 1.45;
      color: #f8fafc; margin: 0 0 18px;
    }
    .notif-btn {
      width: 100%; border: 1px solid rgba(250, 204, 21, 0.35);
      border-radius: 10px; padding: 11px 16px;
      background: var(--app-maroon); color: #ffffff;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .notif-btn:active { background: #991b1b; }

    /* Navigasi Nomor */
    .nav-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; text-align: center; }
    .stat-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 8px 4px; }
    .stat-num { font-size: 16px; font-weight: 800; }
    .stat-lbl { font-size: 11px; color: var(--muted); }
    .num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0; }
    .num-btn {
      padding: 11px 0; border-radius: 10px; border: 1.5px solid var(--border);
      background: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .num-btn.answered { background: var(--success); border-color: var(--success); color: #fff; }
    .num-btn.ragu { background: var(--warning); border-color: var(--warning); color: #fff; }
    .num-btn.current { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35); border-color: var(--primary); }

    /* Box Token di Modal Kirim */
    .token-box {
      background: var(--primary-soft); border: 1.5px solid var(--primary-border);
      border-radius: 12px; padding: 14px; margin: 14px 0;
    }
    .token-input {
      text-align: center; font-size: 18px !important; font-weight: 700;
      letter-spacing: 2px;
    }
    .err-msg {
      color: var(--danger); background: var(--danger-soft);
      border: 1px solid #fecaca; border-radius: 8px;
      padding: 8px 10px; font-size: 13px; font-weight: 600; margin-top: 8px;
    }

    .center-msg { text-align: center; padding: 40px 20px; }
    .field-group { margin-bottom: 16px; }
    .field-label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  </style>
</head>
<body>

<header>
  <div class="hdr-inner">
    <div class="hdr-title-wrap">
      <div class="hdr-sub" id="hdrSub">PENILAIAN DIGITAL</div>
      <h1 id="hdrTitle">Memuat Ujian...</h1>
    </div>
    <div class="hdr-actions">
      <button class="btn-hdr" onclick="cycleFontSize()" title="Ukuran Huruf">Aa</button>
      <button id="btnList" class="btn-hdr" style="display:none;" onclick="openNavModal()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span id="hdrProgressText">Soal</span>
      </button>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
</header>

<div class="container" id="app">
  <div class="card center-msg">Menyiapkan lembar soal...</div>
</div>

<div class="footer-bar" id="footerBar" style="display:none;">
  <div class="footer-inner" id="footerInner"></div>
</div>

<!-- Bottom Sheet Picker (Menjodohkan & Dropdown Dalam WebView) -->
<div class="modal-bg sheet-mode" id="gridSheet" onclick="if(event.target===this) closeGridSheet()">
  <div class="modal-box" id="sheetScrollBox">
    <div class="sheet-handle"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;">
      <strong id="sheetTitle" style="font-size:15px;">Pilih Jawaban</strong>
      <button class="btn btn-outline" style="padding:5px 10px; font-size:12px; flex-shrink:0;" onclick="closeGridSheet()">Tutup ✕</button>
    </div>
    <div class="sheet-context" id="sheetContext"></div>
    <div id="sheetOptions"></div>
  </div>
</div>

<!-- Modal Daftar Soal -->
<div class="modal-bg" id="navModal" onclick="if(event.target===this) closeNavModal()">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong style="font-size:16px;">Navigasi Nomor Soal</strong>
      <button class="btn btn-outline" style="padding:5px 10px; font-size:12px;" onclick="closeNavModal()">Tutup ✕</button>
    </div>
    <div class="nav-stats" id="navStats"></div>
    <div class="num-grid" id="numGrid"></div>
    <button class="btn btn-success" style="width:100%; padding:13px;" onclick="closeNavModal(); confirmSubmit();">Selesai & Kirim Jawaban ✓</button>
  </div>
</div>

<!-- Modal Konfirmasi & Token Ujian -->
<div class="modal-bg" id="submitModal" onclick="if(event.target===this) closeSubmitModal()">
  <div class="modal-box">
    <strong style="font-size:17px;">Konfirmasi Pengiriman</strong>
    <p id="submitSummary" style="font-size:14px; color:var(--text-sec); margin:8px 0 12px;"></p>
    <div id="tokenContainer"></div>
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:16px;">
      <button class="btn btn-outline" onclick="closeSubmitModal()">Cek Lagi</button>
      <button class="btn btn-success" id="btnConfirmSend" onclick="doSubmit()">Kirim Jawaban ✓</button>
    </div>
  </div>
</div>

<!-- Modal Notifikasi Kustom -->
<div class="modal-bg" id="notifModal" onclick="if(event.target===this) closeNotif()">
  <div class="notif-box">
    <div class="notif-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <p class="notif-msg" id="notifMsg"></p>
    <button class="notif-btn" onclick="closeNotif()">OK</button>
  </div>
</div>

<script>
  let quiz = null;
  let orderedSoal = [];
  let answers = {};
  let ragu = {};
  let orderIndices = [];
  let step = 0;
  let savedStep = null;
  let storageKey = '';
  let fontStep = 0;
  let saveTimer = null;
  let isSubmitting = false;

  const HURUF = ['A','B','C','D','E','F','G','H','I','J'];
  const FONT_PRESETS = [
    { q: '16px', opt: '15px' },
    { q: '18px', opt: '16.5px' },
    { q: '20px', opt: '18px' }
  ];

  const TYPE_LABELS = {
    MULTIPLE_CHOICE: 'Pilihan Ganda',
    CHECKBOX: 'Pilihan Ganda Kompleks',
    LIST: 'Pilihan Dropdown',
    TEXT: 'Isian Singkat',
    PARAGRAPH_TEXT: 'Uraian',
    GRID: 'Menjodohkan / Kisi',
    CHECKBOX_GRID: 'Petak Centang'
  };

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/\n/g, '<br>');
  }

  function escPlain(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function syncModalBodyLock() {
    document.body.classList.toggle('modal-open', Boolean(document.querySelector('.modal-bg.open')));
  }

  function showNotif(msg) {
    document.getElementById('notifMsg').textContent = msg;
    document.getElementById('notifModal').classList.add('open');
    syncModalBodyLock();
  }

  function closeNotif() {
    document.getElementById('notifModal').classList.remove('open');
    syncModalBodyLock();
  }

  function cycleFontSize() {
    fontStep = (fontStep + 1) % FONT_PRESETS.length;
    document.documentElement.style.setProperty('--q-size', FONT_PRESETS[fontStep].q);
    document.documentElement.style.setProperty('--opt-size', FONT_PRESETS[fontStep].opt);
  }

  async function sha256(str) {
    if (window.crypto && window.crypto.subtle) {
      const buf = new TextEncoder().encode(str);
      const hashBuf = await window.crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    return sha256Fallback(str);
  }

  async function matchTokenHash(rawVal, targetHash) {
    if (!targetHash) return rawVal;
    const candidates = [rawVal, rawVal.toUpperCase(), rawVal.toLowerCase()];
    for (const c of candidates) {
      if ((await sha256(c)) === targetHash) return c;
    }
    return null;
  }

  function sha256Fallback(ascii) {
    const rightRotate = (val, amt) => (val >>> amt) | (val << (32 - amt));
    const mathPow = Math.pow, maxWord = mathPow(2, 32);
    let result = '', words = [], asciiBitLength = ascii.length * 8;
    const hash = [], k = [];
    let primeCounter = 0;
    const isComposite = {};
    for (let candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
        hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += '\x80';
    while (ascii.length % 64 - 56) ascii += '\x00';
    for (let i = 0; i < ascii.length; i++) {
      const j = ascii.charCodeAt(i);
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = ((asciiBitLength / maxWord) | 0);
    words[words.length] = (asciiBitLength);
    for (let j = 0; j < words.length;) {
      const w = words.slice(j, j += 16), oldHash = hash.slice(0);
      for (let i = 0; i < 64; i++) {
        const w15 = w[i - 15], w2 = w[i - 2];
        const a = hash[0], e = hash[4];
        const temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
          + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i]
          + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
          + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
        const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash.unshift((temp1 + temp2) | 0);
        hash[4] = (hash[4] + temp1) | 0;
        hash.pop();
      }
      for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }
    for (let i = 0; i < 8; i++) {
      for (let j = 3; j + 1; j--) {
        const b = (hash[i] >> (j * 8)) & 255;
        result += ((b < 16) ? 0 : '') + b.toString(16);
      }
    }
    return result;
  }

  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  async function init() {
    const params = new URLSearchParams(location.search);
    const soalFile = params.get('s');

    if (!soalFile) {
      document.getElementById('hdrTitle').textContent = 'Portal Penilaian CBT';
      document.getElementById('app').innerHTML = `
        <div class="card center-msg">
          <h2 style="margin:0 0 8px; font-size:20px;">Portal Penilaian Siap</h2>
          <p style="color:var(--text-sec); max-width:420px; margin:0 auto;">Silakan buka tautan ujian melalui aplikasi resmi sekolah.</p>
        </div>`;
      return;
    }

    storageKey = 'cbt_session_' + soalFile;
    try { localStorage.removeItem('cbt_save_' + soalFile); } catch (e) {}

    try {
      const res = await fetch(soalFile + '?t=' + Date.now());
      if (!res.ok) throw new Error('File soal tidak ditemukan (' + res.status + ')');
      quiz = await res.json();
      loadSaved();
      setupOrder();
      startQuiz();
    } catch (e) {
      document.getElementById('hdrTitle').textContent = 'Gagal Memuat';
      document.getElementById('app').innerHTML = `
        <div class="card center-msg">
          <h3 style="color:var(--danger); margin-top:0;">Gagal Memuat Soal</h3>
          <p style="color:var(--text-sec);">${esc(e.message)}</p>
          <button class="btn btn-primary" onclick="location.reload()">Muat Ulang</button>
        </div>`;
    }
  }

  function setupOrder() {
    const total = quiz.soal.length;
    const validSavedOrder = Array.isArray(orderIndices) &&
      orderIndices.length === total &&
      orderIndices.every(i => Number.isInteger(i) && i >= 0 && i < total);

    if (!validSavedOrder) {
      const base = Array.from({ length: total }, (_, i) => i);
      orderIndices = quiz.shuffleQuestions ? shuffleArray(base) : base;
      saveSession(true);
    }
    orderedSoal = orderIndices.map(i => quiz.soal[i]);
  }

  function startQuiz() {
    document.title = quiz.title || 'Penilaian CBT';
    document.getElementById('hdrTitle').textContent = quiz.title || 'Penilaian CBT';
    const hasIdentitas = quiz.identitas && quiz.identitas.length > 0;

    if (typeof savedStep === 'number' && savedStep >= 0 && savedStep < orderedSoal.length) {
      step = savedStep;
    } else {
      step = hasIdentitas ? -1 : 0;
    }
    render();
  }

  function saveSession(immediate = true) {
    if (!storageKey) return;
    const write = () => {
      try {
        sessionStorage.setItem(storageKey, JSON.stringify({ answers, ragu, order: orderIndices, step }));
      } catch (e) {}
    };
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    if (immediate) write();
    else saveTimer = setTimeout(write, 250);
  }

  function loadSaved() {
    try {
      const raw = sessionStorage.getItem(storageKey);
      if (raw) {
        const parsed = JSON.parse(raw);
        answers = parsed.answers || {};
        ragu = parsed.ragu || {};
        orderIndices = parsed.order || [];
        savedStep = typeof parsed.step === 'number' ? parsed.step : null;
      }
    } catch(e) {}
  }

  function getRuleValidationError(q, allowEmpty = false) {
    const v = q.validation || {};
    if (q.type === 'CHECKBOX') {
      const arr = Array.isArray(answers[q.entryId]) ? answers[q.entryId] : [];
      if (allowEmpty && arr.length === 0) return null;
      if (v.exact && arr.length !== v.exact) {
        return `Pilih tepat ${v.exact} jawaban (baru ${arr.length}).`;
      }
      if (v.min && arr.length < v.min) {
        return `Pilih minimal ${v.min} jawaban (baru ${arr.length}).`;
      }
      if (v.max && arr.length > v.max) {
        return `Maksimal ${v.max} jawaban (saat ini ${arr.length}).`;
      }
    }
    if (q.type === 'GRID') {
      const filled = q.rows.filter(r => answers[r.entryId] && answers[r.entryId].length > 0).length;
      if (filled > 0 && filled < q.rows.length) {
        return `Semua baris wajib diisi (baru ${filled} dari ${q.rows.length}).`;
      }
      if (v.onePerCol) {
        const picked = q.rows.map(r => answers[r.entryId]).filter(Boolean);
        if (new Set(picked).size !== picked.length) {
          return 'Setiap kolom hanya boleh dipilih satu kali.';
        }
      }
    }
    if (q.type === 'CHECKBOX_GRID') {
      const filled = q.rows.filter(r => Array.isArray(answers[r.entryId]) && answers[r.entryId].length > 0).length;
      if (filled > 0 && filled < q.rows.length) {
        return `Semua baris wajib diisi (baru ${filled} dari ${q.rows.length}).`;
      }
      if (v.onePerCol) {
        const seen = new Set();
        for (const r of q.rows) {
          const arr = Array.isArray(answers[r.entryId]) ? answers[r.entryId] : [];
          for (const col of arr) {
            if (seen.has(col)) return 'Setiap kolom hanya boleh dipilih satu kali.';
            seen.add(col);
          }
        }
      }
    }
    return null;
  }

  function getQuestionValidationError(q) {
    if (q.type === 'CHECKBOX') {
      const arr = Array.isArray(answers[q.entryId]) ? answers[q.entryId] : [];
      if (q.required && arr.length === 0) return 'Wajib dijawab.';
      if (arr.length > 0 || q.required) {
        const ruleErr = getRuleValidationError(q, false);
        if (ruleErr) return ruleErr;
      }
      return null;
    }
    if (q.type === 'GRID') {
      const filled = q.rows.filter(r => answers[r.entryId] && answers[r.entryId].length > 0).length;
      if (q.required && filled < q.rows.length) {
        return `Semua baris wajib diisi (baru ${filled} dari ${q.rows.length}).`;
      }
      return getRuleValidationError(q, false);
    }
    if (q.type === 'CHECKBOX_GRID') {
      const filled = q.rows.filter(r => Array.isArray(answers[r.entryId]) && answers[r.entryId].length > 0).length;
      if (q.required && filled < q.rows.length) {
        return `Semua baris wajib diisi (baru ${filled} dari ${q.rows.length}).`;
      }
      return getRuleValidationError(q, false);
    }
    const val = answers[q.entryId];
    if (q.required && (val === undefined || String(val).trim() === '')) {
      return 'Wajib dijawab.';
    }
    return null;
  }

  function isQuestionComplete(q) {
    if (getQuestionValidationError(q) !== null) return false;
    if (q.type === 'GRID') return q.rows.every(r => answers[r.entryId] && answers[r.entryId].length > 0);
    if (q.type === 'CHECKBOX_GRID') return q.rows.every(r => Array.isArray(answers[r.entryId]) && answers[r.entryId].length > 0);
    const val = answers[q.entryId];
    if (Array.isArray(val)) return val.length > 0;
    return val !== undefined && String(val).trim() !== '';
  }

  function updateProgressUI() {
    if (!orderedSoal.length) return;
    const total = orderedSoal.length;
    const done = orderedSoal.filter(q => isQuestionComplete(q)).length;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('hdrProgressText').textContent = `${done}/${total}`;
  }

  function isInlineGrid(q) {
    return q.columns.length <= 3 && q.columns.every(c => String(c).trim().length <= 18);
  }

  function getCBHintState(q) {
    const cur = Array.isArray(answers[q.entryId]) ? answers[q.entryId] : [];
    const v = q.validation || {};
    let ruleTxt = 'Boleh memilih lebih dari satu jawaban.';
    let cls = 'grid-hint';
    if (v.exact) {
      ruleTxt = `Pilih tepat ${v.exact} jawaban.`;
      cls += cur.length === v.exact ? ' ok' : ' warn';
    } else if (v.min && v.max) {
      ruleTxt = `Pilih ${v.min} sampai ${v.max} jawaban.`;
      cls += (cur.length >= v.min && cur.length <= v.max) ? ' ok' : ' warn';
    } else if (v.min) {
      ruleTxt = `Pilih minimal ${v.min} jawaban.`;
      cls += cur.length >= v.min ? ' ok' : ' warn';
    } else if (v.max) {
      ruleTxt = `Pilih maksimal ${v.max} jawaban.`;
      cls += (cur.length > 0 && cur.length <= v.max) ? ' ok' : ' warn';
    }
    return { cls, ruleTxt, count: cur.length };
  }

  function getGridConflictInfo(q) {
    const onePerCol = Boolean(q.validation && q.validation.onePerCol);
    const colOwner = {};
    const colCounts = {};
    if (q.type === 'GRID') {
      q.rows.forEach((r, ri) => {
        const val = answers[r.entryId];
        if (val) {
          colCounts[val] = (colCounts[val] || 0) + 1;
          if (colOwner[val] === undefined) colOwner[val] = ri;
        }
      });
    } else if (q.type === 'CHECKBOX_GRID') {
      q.rows.forEach((r, ri) => {
        const arr = Array.isArray(answers[r.entryId]) ? answers[r.entryId] : [];
        arr.forEach(val => {
          colCounts[val] = (colCounts[val] || 0) + 1;
          if (colOwner[val] === undefined) colOwner[val] = ri;
        });
      });
    }
    const dupCols = new Set();
    if (onePerCol) {
      Object.keys(colCounts).forEach(k => { if (colCounts[k] > 1) dupCols.add(k); });
    }
    return { onePerCol, dupCols, hasDup: dupCols.size > 0, colOwner };
  }

  function getGridHintState(q) {
    const { onePerCol, hasDup } = getGridConflictInfo(q);
    let cls = 'grid-hint';
    let html = '';

    if (q.type === 'GRID') {
      const inlineMode = isInlineGrid(q);
      const filled = q.rows.filter(r => answers[r.entryId]).length;
      html = inlineMode
        ? 'Pilih satu jawaban di setiap baris.'
        : 'Tap <strong>"Pilih Pasangan"</strong> di tiap baris.';
      if (onePerCol) {
        if (hasDup) {
          cls += ' warn';
          html = 'Setiap kolom hanya boleh dipilih satu kali.';
        } else {
          html += ' (1 jawaban per kolom)';
          if (filled === q.rows.length && filled > 0) cls += ' ok';
        }
      } else if (filled === q.rows.length && filled > 0) {
        cls += ' ok';
      }
    } else {
      const filled = q.rows.filter(r => Array.isArray(answers[r.entryId]) && answers[r.entryId].length > 0).length;
      html = 'Pilih satu atau beberapa jawaban di tiap baris.';
      if (onePerCol) {
        if (hasDup) {
          cls += ' warn';
          html = 'Setiap kolom hanya boleh dipilih satu kali.';
        } else {
          html += ' (1 jawaban per kolom)';
          if (filled === q.rows.length && filled > 0) cls += ' ok';
        }
      } else if (filled === q.rows.length && filled > 0) {
        cls += ' ok';
      }
    }
    return { cls, html };
  }

  function render() {
    document.body.classList.remove('kb-open');
    const app = document.getElementById('app');
    const footer = document.getElementById('footerBar');
    const footerInner = document.getElementById('footerInner');
    const btnList = document.getElementById('btnList');

    updateProgressUI();

    if (step === -1) {
      btnList.style.display = 'none';
      footer.style.display = 'none';
      document.getElementById('hdrSub').textContent = 'DATA PESERTA';
      let html = `<div class="card">
        <div class="badge-num" style="display:inline-block; margin-bottom:10px;">IDENTITAS PESERTA</div>
        <h2 style="margin:0 0 6px; font-size:20px;">${esc(quiz.title)}</h2>
        ${quiz.description ? `<p class="q-desc" style="margin-top:4px;">${esc(quiz.description)}</p>` : ''}
        <hr style="border:none; border-top:1px solid var(--border); margin:16px 0;">`;

      quiz.identitas.forEach((f, idx) => {
        const val = answers[f.entryId] || '';
        html += `<div class="field-group">
          <label class="field-label">${esc(f.title)}${f.required ? '<span class="req">*</span>' : ''}</label>`;
        if (f.type === 'LIST' || f.type === 'MULTIPLE_CHOICE') {
          html += `<button type="button" id="idTrig_${idx}" class="match-trigger select-style ${val ? 'filled' : ''}" onclick="openSelectSheet('id', ${idx})">
            <span id="idTrigTxt_${idx}">${val ? esc(val) : '-- Pilih ' + esc(f.title) + ' --'}</span>
            <span id="idTrigBadge_${idx}" class="match-trigger-badge">${val ? 'Ubah ▾' : 'Pilih ▾'}</span>
          </button>`;
        } else {
          html += `<input type="text" value="${escPlain(val)}" placeholder="Masukkan ${escPlain(f.title)}..." oninput="setIdentity(${idx}, this.value, false)" onblur="saveSession(true)">`;
        }
        html += `</div>`;
      });

      html += `<button class="btn btn-primary" style="width:100%; padding:14px; font-size:15px; margin-top:8px;" onclick="finishIdentity()">Mulai Mengerjakan Soal →</button></div>`;
      app.innerHTML = html;
      window.scrollTo(0, 0);
      return;
    }

    btnList.style.display = 'inline-flex';
    footer.style.display = 'block';
    const q = orderedSoal[step];
    const total = orderedSoal.length;
    document.getElementById('hdrSub').textContent = `SOAL ${step + 1} DARI ${total}`;

    let html = `<div class="card">
      <div class="card-top-bar">
        <span class="badge-num">Nomor ${step + 1} / ${total}</span>
        <span class="badge-type">${TYPE_LABELS[q.type] || 'Soal'}</span>
      </div>
      ${q.sectionTitle ? `<div class="sec-banner">${esc(q.sectionTitle)}</div>` : ''}
      ${q.image ? `<img class="q-img" loading="lazy" src="${escPlain(q.image)}" alt="Gambar Soal">` : ''}
      <div class="q-title">${esc(q.title)}${q.required ? '<span class="req">*</span>' : ''}</div>
      ${q.description ? `<div class="q-desc">${esc(q.description)}</div>` : ''}`;

    if (q.type === 'MULTIPLE_CHOICE') {
      const cur = answers[q.entryId] || '';
      html += `<div id="qOptions">`;
      q.choices.forEach((c, i) => {
        const sel = cur === c ? 'selected' : '';
        html += `<div class="opt-item ${sel}" data-idx="${i}" onclick="pickMC(${step}, ${i})">
          <div class="opt-marker">${HURUF[i] || (i+1)}</div>
          <div class="opt-text">${esc(c)}</div>
        </div>`;
      });
      html += `</div>`;
    } else if (q.type === 'CHECKBOX') {
      const cur = Array.isArray(answers[q.entryId]) ? answers[q.entryId] : [];
      const hState = getCBHintState(q);
      html += `<div id="cbHint" class="${hState.cls}">
        <span>${hState.ruleTxt}</span>
        <strong id="cbCount">Terpilih: ${hState.count}</strong>
      </div><div id="qOptions">`;
      q.choices.forEach((c, i) => {
        const sel = cur.includes(c) ? 'selected' : '';
        html += `<div class="opt-item ${sel}" data-idx="${i}" onclick="pickCB(${step}, ${i})">
          <div class="opt-marker">${sel ? '✓' : ''}</div>
          <div class="opt-text">${esc(c)}</div>
        </div>`;
      });
      html += `</div>`;
    } else if (q.type === 'LIST') {
      const cur = answers[q.entryId] || '';
      html += `<button type="button" id="listTrig" class="match-trigger select-style ${cur ? 'filled' : ''}" onclick="openSelectSheet('q', ${step})">
        <span id="listTrigTxt">${cur ? esc(cur) : '-- Pilih Jawaban --'}</span>
        <span id="listTrigBadge" class="match-trigger-badge">${cur ? 'Ubah ▾' : 'Pilih ▾'}</span>
      </button>`;
    } else if (q.type === 'TEXT') {
      const cur = answers[q.entryId] || '';
      html += `<input type="text" value="${escPlain(cur)}" placeholder="Ketik jawaban singkat Anda..." oninput="pickText(${step}, this.value, false)" onblur="saveSession(true)">`;
    } else if (q.type === 'PARAGRAPH_TEXT') {
      const cur = answers[q.entryId] || '';
      html += `<textarea rows="5" placeholder="Ketik jawaban uraian Anda..." oninput="pickText(${step}, this.value, false)" onblur="saveSession(true)">${escPlain(cur)}</textarea>`;
    } else if (q.type === 'GRID') {
      const inlineMode = isInlineGrid(q);
      const hint = getGridHintState(q);
      const { onePerCol, dupCols, colOwner } = getGridConflictInfo(q);
      html += `<div id="gridHint" class="${hint.cls}"><span>${hint.html}</span></div>`;

      q.rows.forEach((r, ri) => {
        const cur = answers[r.entryId] || '';
        const isConflict = cur && dupCols.has(cur);
        const cardCls = `grid-card${cur ? ' answered' : ''}${isConflict ? ' conflict' : ''}`;
        html += `<div id="gridCard_${ri}" class="${cardCls}">
          <div class="grid-row-head">
            <div class="grid-row-num">${ri + 1}</div>
            <div class="grid-row-label">${esc(r.label)}</div>
          </div>`;

        if (inlineMode) {
          html += `<div class="inline-pills">
            ${q.columns.map((col, ci) => {
              const isSel = cur === col;
              const isLocked = onePerCol && !isSel && colOwner[col] !== undefined && colOwner[col] !== ri;
              return `<div class="inline-pill ${isSel ? 'selected' : ''} ${isLocked ? 'locked' : ''}" data-ci="${ci}" onclick="pickGridOption(${step}, ${ri}, ${ci}, true)">${esc(col)}</div>`;
            }).join('')}
          </div>`;
        } else {
          const colIdx = cur ? q.columns.indexOf(cur) : -1;
          const badgeTxt = colIdx >= 0 ? `Opsi ${HURUF[colIdx] || (colIdx + 1)}` : 'Pilih ▾';
          html += `<button type="button" id="gridTrig_${ri}" class="match-trigger ${cur ? 'filled' : ''}" onclick="openGridSheet(${step}, ${ri})">
            <span id="gridTrigTxt_${ri}">${cur ? esc(cur) : 'Pilih pasangan jawaban...'}</span>
            <span id="gridTrigBadge_${ri}" class="match-trigger-badge">${badgeTxt}</span>
          </button>`;
        }
        html += `</div>`;
      });
    } else if (q.type === 'CHECKBOX_GRID') {
      const hint = getGridHintState(q);
      const { onePerCol, dupCols, colOwner } = getGridConflictInfo(q);
      html += `<div id="gridHint" class="${hint.cls}"><span>${hint.html}</span></div>`;

      q.rows.forEach((r, ri) => {
        const curArr = Array.isArray(answers[r.entryId]) ? answers[r.entryId] : [];
        const isConflict = curArr.some(v => dupCols.has(v));
        const cardCls = `grid-card${curArr.length ? ' answered' : ''}${isConflict ? ' conflict' : ''}`;
        html += `<div id="gridCard_${ri}" class="${cardCls}">
          <div class="grid-row-head">
            <div class="grid-row-num">${ri + 1}</div>
            <div class="grid-row-label">${esc(r.label)}</div>
          </div>
          <div class="cb-grid-opts">
            ${q.columns.map((col, ci) => {
              const isSel = curArr.includes(col);
              const isLocked = onePerCol && !isSel && colOwner[col] !== undefined && colOwner[col] !== ri;
              return `<div class="cb-pill ${isSel ? 'selected' : ''} ${isLocked ? 'locked' : ''}" data-ci="${ci}" onclick="toggleCBGrid(${step}, ${ri}, ${ci})"><span class="cb-tick">✓</span><span>${esc(col)}</span></div>`;
            }).join('')}
          </div>
        </div>`;
      });
    }

    html += `</div>`;
    app.innerHTML = html;

    const isRagu = !!ragu[step];
    const isLast = step === total - 1;
    footerInner.innerHTML = `
      <button class="btn btn-outline" onclick="prevStep()" ${step === 0 && !(quiz.identitas && quiz.identitas.length) ? 'disabled' : ''}>← Kembali</button>
      <button id="btnRagu" class="btn btn-warning ${isRagu ? 'active' : ''}" onclick="toggleRagu()">⚑ Ragu</button>
      ${isLast
        ? `<button class="btn btn-success" onclick="confirmSubmit()">Selesai ✓</button>`
        : `<button class="btn btn-primary" onclick="nextStep()">Lanjut →</button>`
      }`;
    window.scrollTo(0, 0);
  }

  /* Update DOM terarah (tanpa rebuild HTML -> nol scroll jump) */
  function updateMCUI(q) {
    const cur = answers[q.entryId] || '';
    const opts = document.querySelectorAll('#qOptions .opt-item');
    opts.forEach((el, i) => el.classList.toggle('selected', cur === q.choices[i]));
  }

  function updateCBUI(q) {
    const cur = Array.isArray(answers[q.entryId]) ? answers[q.entryId] : [];
    const opts = document.querySelectorAll('#qOptions .opt-item');
    opts.forEach((el, i) => {
      const sel = cur.includes(q.choices[i]);
      el.classList.toggle('selected', sel);
      const marker = el.querySelector('.opt-marker');
      if (marker) marker.textContent = sel ? '✓' : '';
    });
    const hState = getCBHintState(q);
    const hintEl = document.getElementById('cbHint');
    const countEl = document.getElementById('cbCount');
    if (hintEl) hintEl.className = hState.cls;
    if (countEl) countEl.textContent = 'Terpilih: ' + hState.count;
  }

  function updateGridUI(q) {
    const inlineMode = isInlineGrid(q);
    const hint = getGridHintState(q);
    const { onePerCol, dupCols, colOwner } = getGridConflictInfo(q);

    const hintEl = document.getElementById('gridHint');
    if (hintEl) {
      hintEl.className = hint.cls;
      hintEl.innerHTML = `<span>${hint.html}</span>`;
    }

    q.rows.forEach((r, ri) => {
      const cur = answers[r.entryId] || '';
      const isConflict = Boolean(cur && dupCols.has(cur));
      const card = document.getElementById('gridCard_' + ri);
      if (!card) return;
      card.classList.toggle('answered', Boolean(cur));
      card.classList.toggle('conflict', isConflict);

      if (inlineMode) {
        const pills = card.querySelectorAll('.inline-pill');
        pills.forEach((p, ci) => {
          const col = q.columns[ci];
          const isSel = cur === col;
          const isLocked = onePerCol && !isSel && colOwner[col] !== undefined && colOwner[col] !== ri;
          p.classList.toggle('selected', isSel);
          p.classList.toggle('locked', isLocked);
        });
      } else {
        const trig = document.getElementById('gridTrig_' + ri);
        const txt = document.getElementById('gridTrigTxt_' + ri);
        const badge = document.getElementById('gridTrigBadge_' + ri);
        const colIdx = cur ? q.columns.indexOf(cur) : -1;
        if (trig) trig.classList.toggle('filled', Boolean(cur));
        if (txt) txt.innerHTML = cur ? esc(cur) : 'Pilih pasangan jawaban...';
        if (badge) badge.textContent = colIdx >= 0 ? `Opsi ${HURUF[colIdx] || (colIdx + 1)}` : 'Pilih ▾';
      }
    });
  }

  function updateCBGridUI(q) {
    const hint = getGridHintState(q);
    const { onePerCol, dupCols, colOwner } = getGridConflictInfo(q);

    const hintEl = document.getElementById('gridHint');
    if (hintEl) {
      hintEl.className = hint.cls;
      hintEl.innerHTML = `<span>${hint.html}</span>`;
    }

    q.rows.forEach((r, ri) => {
      const curArr = Array.isArray(answers[r.entryId]) ? answers[r.entryId] : [];
      const isConflict = curArr.some(v => dupCols.has(v));
      const card = document.getElementById('gridCard_' + ri);
      if (!card) return;
      card.classList.toggle('answered', curArr.length > 0);
      card.classList.toggle('conflict', isConflict);

      const pills = card.querySelectorAll('.cb-pill');
      pills.forEach((p, ci) => {
        const col = q.columns[ci];
        const isSel = curArr.includes(col);
        const isLocked = onePerCol && !isSel && colOwner[col] !== undefined && colOwner[col] !== ri;
        p.classList.toggle('selected', isSel);
        p.classList.toggle('locked', isLocked);
      });
    });
  }

  /* Bottom Sheet Pengganti Dropdown Native (100% di dalam WebView, aman dari anti-floating) */
  function openSelectSheet(mode, idx) {
    const item = mode === 'id' ? quiz.identitas[idx] : orderedSoal[idx];
    const cur = answers[item.entryId] || '';
    const choices = item.choices || [];
    const titleStr = String(item.title || '').trim();

    const titleEl = document.getElementById('sheetTitle');
    const ctxEl = document.getElementById('sheetContext');

    if (mode === 'id' && titleStr && titleStr.length <= 28) {
      titleEl.textContent = 'Pilih ' + titleStr;
      ctxEl.style.display = 'none';
    } else {
      titleEl.textContent = 'Pilih Jawaban';
      ctxEl.style.display = 'block';
      ctxEl.innerHTML = esc(titleStr);
    }

    const optsHtml = choices.map((c, ci) => {
      const sel = cur === c;
      return `<div class="sheet-opt ${sel ? 'selected' : ''}" onclick="pickSelectOption('${mode}', ${idx}, ${ci}); closeGridSheet();">
        <div class="sheet-opt-key">${sel ? '✓' : (ci + 1)}</div>
        <div class="sheet-opt-body"><div>${esc(c)}</div></div>
      </div>`;
    }).join('');

    document.getElementById('sheetOptions').innerHTML = optsHtml;
    const scrollBox = document.getElementById('sheetScrollBox');
    if (scrollBox) scrollBox.scrollTop = 0;
    document.getElementById('gridSheet').classList.add('open');
    syncModalBodyLock();
  }

  function pickSelectOption(mode, idx, cIdx) {
    if (mode === 'id') {
      const f = quiz.identitas[idx];
      const val = (f.choices || [])[cIdx] || '';
      answers[f.entryId] = val;
      saveSession(true);

      const trig = document.getElementById('idTrig_' + idx);
      const txt = document.getElementById('idTrigTxt_' + idx);
      const badge = document.getElementById('idTrigBadge_' + idx);
      if (trig) trig.classList.toggle('filled', Boolean(val));
      if (txt) txt.innerHTML = val ? esc(val) : '-- Pilih ' + esc(f.title) + ' --';
      if (badge) badge.textContent = val ? 'Ubah ▾' : 'Pilih ▾';
    } else {
      const q = orderedSoal[idx];
      const val = (q.choices || [])[cIdx] || '';
      answers[q.entryId] = val;
      updateProgressUI();
      saveSession(true);

      const trig = document.getElementById('listTrig');
      const txt = document.getElementById('listTrigTxt');
      const badge = document.getElementById('listTrigBadge');
      if (trig) trig.classList.toggle('filled', Boolean(val));
      if (txt) txt.innerHTML = val ? esc(val) : '-- Pilih Jawaban --';
      if (badge) badge.textContent = val ? 'Ubah ▾' : 'Pilih ▾';
    }
  }

  /* Bottom Sheet Menjodohkan */
  function openGridSheet(qIdx, rIdx) {
    const q = orderedSoal[qIdx];
    const row = q.rows[rIdx];
    const cur = answers[row.entryId] || '';
    const onePerCol = Boolean(q.validation && q.validation.onePerCol);

    const usedByRow = {};
    q.rows.forEach((otherRow, idx) => {
      if (idx !== rIdx && answers[otherRow.entryId]) {
        usedByRow[answers[otherRow.entryId]] = idx + 1;
      }
    });

    document.getElementById('sheetTitle').textContent = 'Pilih Pasangan Jawaban';
    const ctxEl = document.getElementById('sheetContext');
    ctxEl.style.display = 'block';
    ctxEl.innerHTML = `<span style="color:var(--muted); font-size:12px; display:block;">Pernyataan ${rIdx + 1}:</span>${esc(row.label)}`;

    let optsHtml = q.columns.map((col, ci) => {
      const sel = cur === col;
      const usedRowNum = usedByRow[col];
      const locked = onePerCol && !sel && usedRowNum;
      return `<div class="sheet-opt ${sel ? 'selected' : ''} ${locked ? 'locked' : ''}" onclick="if(pickGridOption(${qIdx}, ${rIdx}, ${ci}, false)) closeGridSheet();">
        <div class="sheet-opt-key">${sel ? '✓' : (HURUF[ci] || (ci + 1))}</div>
        <div class="sheet-opt-body">
          <div>${esc(col)}</div>
          ${usedRowNum && !sel
            ? `<span class="used-tag ${onePerCol ? 'strict' : ''}">${onePerCol ? 'Sudah dipakai baris ' + usedRowNum : 'Dipilih di baris ' + usedRowNum}</span>`
            : ''}
        </div>
      </div>`;
    }).join('');

    if (cur) {
      optsHtml += `<button class="btn btn-outline" style="width:100%; margin-top:6px; color:var(--danger); border-color:#fecaca;" onclick="clearGridOption(${qIdx}, ${rIdx}); closeGridSheet();">Kosongkan Baris Ini</button>`;
    }

    document.getElementById('sheetOptions').innerHTML = optsHtml;
    const scrollBox = document.getElementById('sheetScrollBox');
    if (scrollBox) scrollBox.scrollTop = 0;
    document.getElementById('gridSheet').classList.add('open');
    syncModalBodyLock();
  }

  function closeGridSheet() {
    document.getElementById('gridSheet').classList.remove('open');
    syncModalBodyLock();
  }

  function pickGridOption(qIdx, rIdx, cIdx, allowToggleOff = false) {
    const q = orderedSoal[qIdx];
    const row = q.rows[rIdx];
    const colVal = q.columns[cIdx];

    if (allowToggleOff && answers[row.entryId] === colVal) {
      delete answers[row.entryId];
      updateGridUI(q);
      updateProgressUI();
      saveSession(true);
      return true;
    }

    if (q.validation && q.validation.onePerCol) {
      for (let i = 0; i < q.rows.length; i++) {
        if (i !== rIdx && answers[q.rows[i].entryId] === colVal) {
          showNotif(`Kolom ini sudah dipakai di baris ${i + 1}.`);
          return false;
        }
      }
    }

    answers[row.entryId] = colVal;
    updateGridUI(q);
    updateProgressUI();
    saveSession(true);
    return true;
  }

  function clearGridOption(qIdx, rIdx) {
    const q = orderedSoal[qIdx];
    delete answers[q.rows[rIdx].entryId];
    updateGridUI(q);
    updateProgressUI();
    saveSession(true);
  }

  function setIdentity(idx, val, immediate) {
    answers[quiz.identitas[idx].entryId] = val;
    saveSession(immediate);
  }

  async function finishIdentity() {
    for (const f of quiz.identitas) {
      const val = String(answers[f.entryId] || '').trim();
      if (f.required && !val) {
        showNotif(`Isi ${f.title} terlebih dahulu.`);
        return;
      }
      if (f.tokenHash && val) {
        const matched = await matchTokenHash(val, f.tokenHash);
        if (matched === null) {
          showNotif('Token salah.');
          return;
        }
        answers[f.entryId] = matched;
      }
    }
    step = 0;
    saveSession(true);
    render();
  }

  function pickMC(qIdx, cIdx) {
    const q = orderedSoal[qIdx];
    answers[q.entryId] = q.choices[cIdx];
    updateMCUI(q);
    updateProgressUI();
    saveSession(true);
  }

  function pickCB(qIdx, cIdx) {
    const q = orderedSoal[qIdx];
    const val = q.choices[cIdx];
    let arr = Array.isArray(answers[q.entryId]) ? [...answers[q.entryId]] : [];
    if (arr.includes(val)) arr = arr.filter(x => x !== val);
    else arr.push(val);
    answers[q.entryId] = arr;
    updateCBUI(q);
    updateProgressUI();
    saveSession(true);
  }

  function pickText(qIdx, val, immediate) {
    answers[orderedSoal[qIdx].entryId] = val;
    updateProgressUI();
    saveSession(immediate);
  }

  function toggleCBGrid(qIdx, rIdx, cIdx) {
    const q = orderedSoal[qIdx];
    const row = q.rows[rIdx];
    const colVal = q.columns[cIdx];
    let arr = Array.isArray(answers[row.entryId]) ? [...answers[row.entryId]] : [];

    if (!arr.includes(colVal) && q.validation && q.validation.onePerCol) {
      for (let i = 0; i < q.rows.length; i++) {
        if (i !== rIdx) {
          const otherArr = Array.isArray(answers[q.rows[i].entryId]) ? answers[q.rows[i].entryId] : [];
          if (otherArr.includes(colVal)) {
            showNotif(`Kolom ini sudah dipakai di baris ${i + 1}.`);
            return;
          }
        }
      }
    }

    if (arr.includes(colVal)) arr = arr.filter(x => x !== colVal);
    else arr.push(colVal);
    answers[row.entryId] = arr;
    updateCBGridUI(q);
    updateProgressUI();
    saveSession(true);
  }

  function toggleRagu() {
    ragu[step] = !ragu[step];
    const btn = document.getElementById('btnRagu');
    if (btn) btn.classList.toggle('active', !!ragu[step]);
    saveSession(true);
  }

  function prevStep() {
    if (step > 0) { step--; saveSession(true); render(); }
    else if (quiz.identitas && quiz.identitas.length) { step = -1; saveSession(true); render(); }
  }

  function nextStep() {
    const q = orderedSoal[step];
    const ruleErr = getRuleValidationError(q, true);
    if (ruleErr) {
      showNotif(ruleErr);
      return;
    }
    if (step < orderedSoal.length - 1) { step++; saveSession(true); render(); }
  }

  function jumpTo(idx) {
    step = idx;
    saveSession(true);
    closeNavModal();
    render();
  }

  function openNavModal() {
    let terjawab = 0, jumRagu = 0, belum = 0;
    const grid = document.getElementById('numGrid');
    grid.innerHTML = orderedSoal.map((q, i) => {
      let cls = 'num-btn';
      if (ragu[i]) { cls += ' ragu'; jumRagu++; }
      else if (isQuestionComplete(q)) { cls += ' answered'; terjawab++; }
      else { belum++; }
      if (i === step) cls += ' current';
      return `<button class="${cls}" onclick="jumpTo(${i})">${i + 1}</button>`;
    }).join('');

    document.getElementById('navStats').innerHTML = `
      <div class="stat-box"><div class="stat-num" style="color:var(--success);">${terjawab}</div><div class="stat-lbl">Terjawab</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--warning);">${jumRagu}</div><div class="stat-lbl">Ragu-ragu</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--muted);">${belum}</div><div class="stat-lbl">Belum</div></div>
    `;
    document.getElementById('navModal').classList.add('open');
    syncModalBodyLock();
  }
  function closeNavModal() {
    document.getElementById('navModal').classList.remove('open');
    syncModalBodyLock();
  }

  function confirmSubmit() {
    let terjawab = 0;
    for (let i = 0; i < orderedSoal.length; i++) {
      const q = orderedSoal[i];
      const err = getQuestionValidationError(q);
      if (err) {
        step = i;
        saveSession(true);
        render();
        showNotif(`Nomor ${i + 1}: ${err}`);
        return;
      }
      if (isQuestionComplete(q)) terjawab++;
    }

    const btn = document.getElementById('btnConfirmSend');
    btn.disabled = false;
    btn.textContent = 'Kirim Jawaban ✓';

    document.getElementById('submitSummary').textContent =
      `Terjawab ${terjawab} dari ${orderedSoal.length} soal. Pastikan semua jawaban sudah dicek kembali sebelum dikirim.`;

    const tokenContainer = document.getElementById('tokenContainer');
    if (quiz.tokenField) {
      tokenContainer.innerHTML = `
        <div class="token-box">
          <label class="field-label" style="color:var(--primary-dark);">${esc(quiz.tokenField.title)}<span class="req">*</span></label>
          <div style="font-size:12.5px; color:var(--text-sec); margin-bottom:8px;">${esc(quiz.tokenField.description)}</div>
          <input type="text" id="examTokenInput" class="token-input" placeholder="Ketik Token" autocomplete="off" onkeydown="if(event.key==='Enter') doSubmit()">
          <div id="tokenErr" class="err-msg" style="display:none;"></div>
        </div>`;
    } else {
      tokenContainer.innerHTML = '';
    }

    document.getElementById('submitModal').classList.add('open');
    syncModalBodyLock();
  }
  function closeSubmitModal() {
    const sm = document.getElementById('submitModal');
    sm.classList.remove('open', 'kb-modal');
    syncModalBodyLock();
  }

  async function doSubmit() {
    if (isSubmitting) return;
    const btn = document.getElementById('btnConfirmSend');
    let tokenVal = '';

    if (quiz.tokenField) {
      const inp = document.getElementById('examTokenInput');
      const errEl = document.getElementById('tokenErr');
      tokenVal = inp ? inp.value.trim() : '';

      if (quiz.tokenField.required && !tokenVal) {
        errEl.textContent = 'Token wajib diisi.';
        errEl.style.display = 'block';
        return;
      }
      if (quiz.tokenField.hash && tokenVal) {
        const matched = await matchTokenHash(val = tokenVal, quiz.tokenField.hash);
        if (matched === null) {
          errEl.textContent = 'Token salah.';
          errEl.style.display = 'block';
          return;
        }
        tokenVal = matched;
      }
      errEl.style.display = 'none';
    }

    if (navigator.onLine === false) {
      showNotif('Koneksi internet terputus.');
      return;
    }

    isSubmitting = true;
    btn.disabled = true;
    btn.textContent = 'Mengirim...';

    const params = new URLSearchParams();
    if (quiz.pageHistory) params.append('pageHistory', quiz.pageHistory);
    params.append('fvv', '1');

    Object.keys(answers).forEach(entryId => {
      const val = answers[entryId];
      if (Array.isArray(val)) {
        val.forEach(v => params.append(entryId, v));
      } else if (val !== undefined && val !== '') {
        params.append(entryId, val);
      }
    });

    if (quiz.tokenField && tokenVal) {
      params.append(quiz.tokenField.entryId, tokenVal);
    }

    try {
      await fetch(quiz.formAction, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString()
      });
      try { sessionStorage.removeItem(storageKey); } catch(e) {}
      closeSubmitModal();
      showDone('Jawaban Berhasil Dikirim!', 'Terima kasih telah menyelesaikan penilaian. Silakan tutup halaman atau ikuti arahan pengawas.');
    } catch (e) {
      showNotif('Gagal mengirim jawaban. Periksa sinyal lalu coba lagi.');
      isSubmitting = false;
      btn.disabled = false;
      btn.textContent = 'Kirim Jawaban ✓';
    }
  }

  function showDone(title, msg) {
    document.getElementById('btnList').style.display = 'none';
    document.getElementById('footerBar').style.display = 'none';
    document.getElementById('hdrSub').textContent = 'SELESAI';
    document.getElementById('app').innerHTML = `
      <div class="card center-msg">
        <div style="width:64px; height:64px; border-radius:999px; background:var(--success-soft); color:var(--success); display:inline-flex; align-items:center; justify-content:center; font-size:32px; font-weight:700; margin-bottom:14px;">✓</div>
        <h2 style="margin:0 0 8px; font-size:21px;">${esc(title)}</h2>
        <p style="color:var(--text-sec); max-width:420px; margin:0 auto;">${esc(msg)}</p>
      </div>`;
  }

  let kbBlurTimer = null;
  document.addEventListener('focusin', (e) => {
    const el = e.target;
    if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) return;
    if (kbBlurTimer) { clearTimeout(kbBlurTimer); kbBlurTimer = null; }

    const inSubmitModal = el.closest('#submitModal');
    if (inSubmitModal) {
      inSubmitModal.classList.add('kb-modal');
      return;
    }

    document.body.classList.add('kb-open');
    const geserKeAtas = () => {
      if (document.activeElement !== el) return;
      const rect = el.getBoundingClientRect();
      const batasAtas = Math.max(120, Math.min(200, window.innerHeight * 0.32));
      if (rect.top > batasAtas || rect.top < 80) {
        window.scrollTo(0, Math.max(0, window.scrollY + rect.top - 115));
      }
    };
    setTimeout(geserKeAtas, 200);
    setTimeout(geserKeAtas, 450);
  });

  document.addEventListener('focusout', () => {
    if (kbBlurTimer) clearTimeout(kbBlurTimer);
    kbBlurTimer = setTimeout(() => {
      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
      document.body.classList.remove('kb-open');
      const sm = document.getElementById('submitModal');
      if (sm) sm.classList.remove('kb-modal');
    }, 250);
  });

  init();
</script>
</body>
</html>
